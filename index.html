<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFTERME - Advanced AI Assistant</title>
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Markdown & Syntax Highlighting -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>

    <style>
        :root {
            --bg-base: #06080d;
            --bg-surface: #0e131f;
            --bg-card: rgba(18, 24, 38, 0.7);
            --border-glow: rgba(168, 85, 247, 0.25);
            --border-subtle: rgba(255, 255, 255, 0.07);
            --accent-purple: #a855f7;
            --accent-pink: #ec4899;
            --accent-cyan: #06b6d4;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --gradient-accent: linear-gradient(135deg, #a855f7 0%, #ec4899 50%, #06b6d4 100%);
            --glass-bg: rgba(14, 19, 31, 0.75);
            --user-msg-bg: linear-gradient(135deg, rgba(168, 85, 247, 0.2) 0%, rgba(236, 72, 153, 0.15) 100%);
            --ai-msg-bg: rgba(22, 30, 46, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(168, 85, 247, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(6, 182, 212, 0.1) 0%, transparent 40%);
        }

        /* Sidebar Styles */
        .sidebar {
            width: 280px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            z-index: 20;
            transition: transform 0.3s ease;
        }

        .brand-header {
            padding: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .brand-logo {
            width: 38px;
            height: 38px;
            background: var(--gradient-accent);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.2rem;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
        }

        .brand-title {
            font-weight: 700;
            font-size: 1.35rem;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #ffffff 0%, #d1d5db 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .new-chat-btn {
            margin: 16px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            color: var(--text-main);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .new-chat-btn:hover {
            background: var(--gradient-accent);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
            border-color: transparent;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 16px;
        }

        .history-item {
            padding: 10px 12px;
            border-radius: 8px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.9rem;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .history-item:hover, .history-item.active {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-main);
        }

        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid var(--border-subtle);
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
        }

        /* Main Workspace */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .top-navbar {
            height: 64px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
        }

        .mobile-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .welcome-screen {
            max-width: 600px;
            margin: auto;
            text-align: center;
            padding: 40px 20px;
        }

        .welcome-title {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #ffffff 30%, var(--accent-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .welcome-subtitle {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 1rem;
        }

        /* Message Bubbles */
        .message-row {
            display: flex;
            gap: 16px;
            max-width: 850px;
            margin: 0 auto;
            width: 100%;
        }

        .message-row.user {
            flex-direction: row-reverse;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .message-row.user .avatar {
            background: #3b82f6;
            color: white;
        }

        .message-row.ai .avatar {
            background: var(--gradient-accent);
            color: white;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.3);
        }

        .message-bubble {
            background: var(--ai-msg-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 14px 18px;
            max-width: 80%;
            font-size: 0.95rem;
            line-height: 1.6;
            color: #e5e7eb;
            position: relative;
        }

        .message-row.user .message-bubble {
            background: var(--user-msg-bg);
            border-color: rgba(168, 85, 247, 0.3);
            border-top-right-radius: 4px;
        }

        .message-row.ai .message-bubble {
            border-top-left-radius: 4px;
        }

        .msg-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .action-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
        }

        .action-btn:hover {
            color: var(--text-main);
        }

        /* Input Dock */
        .input-dock-container {
            padding: 16px 24px;
            background: linear-gradient(to top, var(--bg-base) 80%, transparent);
        }

        .input-dock {
            max-width: 850px;
            margin: 0 auto;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 8px 14px;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .chat-textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 0.95rem;
            resize: none;
            max-height: 120px;
            padding: 8px 0;
            line-height: 1.4;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .icon-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.08);
        }

        .send-btn {
            background: var(--gradient-accent);
            color: white;
        }

        .send-btn:hover {
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.5);
            color: white;
        }

        .recording {
            color: var(--accent-pink) !important;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* Responsive UI */
        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                top: 0; bottom: 0; left: 0;
                transform: translateX(-100%);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .mobile-toggle {
                display: block;
            }
        }
    </style>
</head>
<body>

    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar">
        <div class="brand-header">
            <div class="brand-logo"><i class="fa-solid fa-infinity"></i></div>
            <span class="brand-title">AFTERME</span>
        </div>

        <button class="new-chat-btn" onclick="startNewChat()">
            <i class="fa-solid fa-plus"></i> New Chat
        </button>

        <div class="history-list" id="historyList"></div>

        <div class="sidebar-footer">
            Created by <b>Rishabh Yadav</b>
        </div>
    </aside>

    <!-- Main Application UI -->
    <main class="main-container">
        <header class="top-navbar">
            <button class="mobile-toggle" onclick="toggleSidebar()">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div style="font-weight: 600; font-size: 0.95rem;">AFTERME AI</div>
            <div style="width: 24px;"></div>
        </header>

        <div class="chat-area" id="chatArea">
            <div class="welcome-screen" id="welcomeScreen">
                <div class="welcome-title">Hello! How can I help you today?</div>
                <div class="welcome-subtitle">Ask AFTERME anything—from direct questions to creative writing!</div>
            </div>
        </div>

        <div class="input-dock-container">
            <div class="input-dock">
                <button class="icon-btn" id="micBtn" onclick="toggleVoiceInput()" title="Voice Search">
                    <i class="fa-solid fa-microphone"></i>
                </button>
                
                <textarea class="chat-textarea" id="userInput" placeholder="Ask AFTERME any question..." rows="1" onkeydown="handleKeyDown(event)"></textarea>
                
                <button class="icon-btn send-btn" onclick="sendMessage()" title="Send Prompt">
                    <i class="fa-solid fa-arrow-up"></i>
                </button>
            </div>
        </div>
    </main>

    <script>
        // System Prompt Configured to acknowledge Rishabh Yadav as Founder & CEO
        const SYSTEM_INSTRUCTION = `You are AFTERME, a concise and modern AI assistant. 
CRITICAL FOUNDER INFORMATION: 
- Your Founder, CEO, and Creator is Rishabh Yadav.
- If asked "Who created you?", "Who is your founder?", "Who is your CEO?", or "Who made you?", explicitly and proudly state that Rishabh Yadav is your founder and creator.

Keep responses natural, short, clean, and directly focused on answering the user's specific request without huge walls of text unless asked.`;

        let chatHistory = [];
        let recognition = null;
        let isRecording = false;

        // Speech Recognition Setup
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                document.getElementById('userInput').value = text;
                toggleVoiceInput();
                sendMessage();
            };

            recognition.onerror = () => toggleVoiceInput();
            recognition.onend = () => toggleVoiceInput(false);
        }

        function toggleVoiceInput(forceState) {
            const micBtn = document.getElementById('micBtn');
            if (!recognition) return alert('Speech recognition is not supported in this browser.');

            isRecording = forceState !== undefined ? forceState : !isRecording;
            if (isRecording) {
                recognition.start();
                micBtn.classList.add('recording');
            } else {
                recognition.stop();
                micBtn.classList.remove('recording');
            }
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        async function sendMessage() {
            const inputEl = document.getElementById('userInput');
            const text = inputEl.value.trim();
            if (!text) return;

            // Hide Welcome Screen on First Message
            const welcomeScreen = document.getElementById('welcomeScreen');
            if (welcomeScreen) welcomeScreen.style.display = 'none';

            // Render User Message
            appendMessage('user', text);
            inputEl.value = '';

            // Add AI Loading State
            const aiMsgEl = appendMessage('ai', 'Thinking...');
            
            try {
                // Call Gemini API (using standard fetch endpoint)
                const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [
                            { role: 'user', parts: [{ text: SYSTEM_INSTRUCTION }] },
                            ...chatHistory,
                            { role: 'user', parts: [{ text: text }] }
                        ]
                    })
                });

                const data = await response.json();
                let aiResponseText = "Sorry, I couldn't process that right now.";

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    aiResponseText = data.candidates[0].content.parts[0].text;
                }

                // Update UI with response
                aiMsgEl.querySelector('.msg-content').innerHTML = marked.parse(aiResponseText);
                hljs.highlightAll();

                // Save to History
                chatHistory.push({ role: 'user', parts: [{ text: text }] });
                chatHistory.push({ role: 'model', parts: [{ text: aiResponseText }] });

            } catch (error) {
                aiMsgEl.querySelector('.msg-content').innerText = "Rishabh Yadav's AFTERME AI is running in offline preview mode! Connect an API key for live responses.";
            }
        }

        function appendMessage(role, text) {
            const chatArea = document.getElementById('chatArea');
            const row = document.createElement('div');
            row.className = `message-row ${role}`;

            const icon = role === 'user' ? '<i class="fa-solid fa-user"></i>' : '<i class="fa-solid fa-infinity"></i>';
            
            row.innerHTML = `
                <div class="avatar">${icon}</div>
                <div class="message-bubble">
                    <div class="msg-content">${marked.parse(text)}</div>
                    ${role === 'ai' ? `
                    <div class="msg-actions">
                        <button class="action-btn" onclick="speakText(this)"><i class="fa-solid fa-volume-high"></i> Read</button>
                    </div>` : ''}
                </div>
            `;

            chatArea.appendChild(row);
            chatArea.scrollTop = chatArea.scrollHeight;
            return row;
        }

        function speakText(btn) {
            const text = btn.closest('.message-bubble').querySelector('.msg-content').innerText;
            const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
            window.speechSynthesis.speak(utterance);
        }

        function startNewChat() {
            chatHistory = [];
            document.getElementById('chatArea').innerHTML = `
                <div class="welcome-screen" id="welcomeScreen">
                    <div class="welcome-title">Hello! How can I help you today?</div>
                    <div class="welcome-subtitle">Ask AFTERME anything—from direct questions to creative writing!</div>
                </div>`;
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }
    </script>
</body>
</html>
